replicaCount: 2

image:
  repository: ghcr.io/tonibyte/flask-app
  tag: "7676356"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: traefik
  host: tonibyte.duckdns.org
  tls: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

env:
  APP_MODE: production